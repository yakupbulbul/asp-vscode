[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "asp-studio"
version = "0.2.6"
description = "Answer sets, a graph and a step-by-step animator for Answer Set Programming, in Jupyter, VS Code notebooks and the command line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "yakupbulbul" }]
keywords = ["asp", "answer set programming", "clingo", "jupyter", "visualization", "potassco"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Jupyter",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["clingo>=5.5"]

[project.optional-dependencies]
notebook = ["ipython"]
test = ["pytest", "ipython"]

[project.scripts]
asp-studio = "asp_studio.__main__:main"

[project.urls]
Homepage = "https://yakupbulbul.github.io/asp-vscode/"
Documentation = "https://yakupbulbul.github.io/asp-vscode/docs.html"
Source = "https://github.com/yakupbulbul/asp-vscode"
Issues = "https://github.com/yakupbulbul/asp-vscode/issues"
Changelog = "https://github.com/yakupbulbul/asp-vscode/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asp_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
